<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cinedev</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div class="container">
<h1> cinedev</h1>
<h2>Catalago Avancado de Midias</h2>
<div id="mensagemErro"></div>

<form id="midiaForm">
    <select id="selectTipo"> 
        <option value="filme">Filme</option>
        <option value="serie">Serie</option>
    </select>
    <input type="text" id="inputTitulo" placeholder="Titulo da Midia"required>
    <input type="number" id="inputAno" placeholder="Ano de lancamento"required>
    <input type="text" id="intupGenero" placeholder="Genero (ex: Acao, Sci-Fi)">
    <input type="text" id="intupTrailer" placeholder="URL do Trailer (https://...)" required>
    <input type="number" id="inputTemporadas" placeholder="Numero de Temporadas" style="display: nome;">
    
<button type="submit" id="btnCadastrar">Cadrastrar no Catalago</button>
</form>

<hr>

<h2>Filmes e series Cadastrados</h2>
 <div id="containerCatalago" class="grid-catalago"></div>
</div>
    <script src="main.js"></script>
</body>
</html>
